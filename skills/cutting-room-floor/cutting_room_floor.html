<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutting Room Floor · Creative Mash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Creative Mash site palette (creativemash.ie style guide) */
  :root {
    --bg: #e6e6e4; --paper: #faf9f5; --ink: #1d1e1b; --muted: #5c5e56; --rule: #c9cac4; --hair: #e0e1da;
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(.22,1,.36,1);
    --g-blue: linear-gradient(135deg,#2650fa,#4b41d4);
    --g-pink: linear-gradient(90deg,#f06bd0,#f76f8c);
    --g-orange: linear-gradient(45deg,#ff6a2b,#ff9c33);
    --g-green: linear-gradient(180deg,#4cc35a,#50c0ac);
    --g-yellow: linear-gradient(90deg,#ffc93c,#ff9c33);
    --g-purple: linear-gradient(270deg,#5d2fb0,#a351c1);
    --g-sky: linear-gradient(90deg,#5bb8f0,#3789f7);
    --g-navy: linear-gradient(180deg,#13288a,#1c3bc0);
    /* category → brand gradient */
    --c-regen: var(--g-green); --c-backup: var(--g-yellow); --c-unused: var(--g-pink);
    --c-used: var(--g-blue); --c-wt: var(--g-purple); --c-other: linear-gradient(#c9cac4,#c9cac4);
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; animation: none !important; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #2650fa; outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px); }
  .eyebrow { font: 400 13px/1.4 var(--mono); color: var(--muted); margin: 0 0 14px; }
  .mono { font-family: var(--mono); }

  /* header */
  header.top { position: sticky; top: 0; z-index: 5; background: rgba(250,249,245,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  header.top .wrap { display: flex; align-items: center; gap: 18px; height: 76px; }
  .logo { height: 22px; width: auto; color: var(--ink); display: block; }
  .crumb { font: 400 13px var(--mono); color: var(--muted); white-space: nowrap; }
  header.top .spacer { flex: 1; }

  /* pills */
  .pill { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; font-weight: 500; line-height: 1.2; cursor: pointer; white-space: nowrap; padding: 13px 20px; font-size: 14.5px; transition: background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease); }
  .pill.solid { background: var(--ink); color: var(--paper); }
  .pill.solid:hover { background: #41433d; }
  .pill.ring { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pill.ring:hover { background: var(--ink); color: var(--paper); }
  .pill.ghost { background: transparent; color: var(--ink); }
  .pill.ghost:hover { background: var(--bg); }
  .pill.sm { padding: 10px 16px; font-size: 14px; }
  .pill:disabled { opacity: .35; cursor: not-allowed; }
  .pill svg { width: 16px; height: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  h1 { margin: 0; font-size: clamp(44px, 5.6vw, 84px); line-height: .98; letter-spacing: -.045em; font-weight: 500; max-width: 12ch; text-wrap: balance; }
  .lead { margin: 22px 0 0; font-size: clamp(17px, 1.5vw, 22px); line-height: 1.4; color: var(--muted); max-width: 34em; }
  .lead code { font: 400 .8em var(--mono); color: var(--ink); }

  /* facts row */
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
  .facts div { padding: 18px 18px 4px 0; display: flex; flex-direction: column; gap: 8px; }
  .facts div + div { padding-left: 18px; border-left: 1px solid var(--rule); }
  .facts b { font-size: clamp(32px, 3.4vw, 54px); font-weight: 500; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .facts span { font: 400 13px var(--mono); color: var(--muted); }

  /* bold cards */
  .cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin: clamp(24px, 3vw, 44px) 0; }
  .bold { position: relative; overflow: hidden; border-radius: 24px; padding: 28px 28px 32px; min-height: 280px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; color: var(--ink); }
  .bold.light-text { color: #fff; }
  .bold .mk { position: absolute; right: -18px; top: -18px; width: 140px; height: 140px; background: rgba(255,255,255,.22); }
  .bold .k { font: 400 13px var(--mono); opacity: .85; }
  .bold b { font-size: clamp(40px, 4vw, 64px); font-weight: 500; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .bold p { margin: 0; font-size: 16px; line-height: 1.45; max-width: 30ch; }
  .bold.light-text p { color: rgba(255,255,255,.92); }

  /* sections */
  section.block { margin-bottom: clamp(56px, 7vw, 112px); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
  h2 { margin: 0; font-size: clamp(30px, 3.2vw, 50px); line-height: 1.04; letter-spacing: -.035em; font-weight: 500; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }

  .chart { background: var(--bg); border-radius: 24px; padding: 14px 28px; }
  .proj { display: grid; grid-template-columns: minmax(140px, 240px) 1fr 84px; gap: 20px; align-items: center; width: 100%; padding: 13px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
  .proj:last-child { border-bottom: 0; }
  .proj .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: 15px; letter-spacing: -.01em; }
  .proj .pn small { font: 400 12px var(--mono); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
  .proj:hover .pn, .proj.on .pn { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .bar { display: flex; gap: 2px; height: 14px; border-radius: 999px; overflow: hidden; }
  .bar div { height: 100%; min-width: 3px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; }

  /* review */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tab { border: 0; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500; background: transparent; box-shadow: inset 0 0 0 1.5px var(--rule); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: box-shadow .2s var(--ease); }
  .tab:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .tab.on { background: var(--ink); color: var(--paper); box-shadow: none; }
  .tab em { font: 400 12px var(--mono); font-style: normal; opacity: .7; }
  .tools { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 220px; max-width: 440px; height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--bg); }
  input[type=search]::placeholder { color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; cursor: pointer; }

  table { width: 100%; border-collapse: collapse; border-top: 1.5px solid var(--ink); }
  td { padding: 20px 14px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  td:first-child { padding-left: 0; } td:last-child { padding-right: 0; }
  tr.grp td { padding: 14px 0 10px; border-bottom: 1px solid var(--rule); font: 400 13px var(--mono); color: var(--muted); }
  tr.gone td { opacity: .4; } tr.gone .nm { text-decoration: line-through; }
  td.ck { width: 34px; padding-top: 22px; }
  td.ck input { width: 18px; height: 18px; accent-color: #1d1e1b; margin: 0; cursor: pointer; }
  .nm { font-size: 18px; font-weight: 500; letter-spacing: -.02em; word-break: break-word; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .nm .cnt { font: 400 13px var(--mono); color: var(--muted); letter-spacing: 0; }
  .tag { display: inline-flex; align-items: center; gap: 7px; font: 400 11.5px var(--mono); padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--bg); color: var(--ink); letter-spacing: 0; }
  .tag .dot { width: 8px; height: 8px; }
  .pth { font: 400 12.5px/1.5 var(--mono); color: var(--muted); word-break: break-all; margin-top: 4px; }
  .note { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 8px; max-width: 60ch; }
  td.sz { width: 140px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 18px; font-weight: 500; letter-spacing: -.02em; }
  .mini { height: 4px; border-radius: 999px; background: var(--ink); margin-top: 10px; margin-left: auto; }
  td.act { width: 170px; text-align: right; }

  /* footer */
  footer.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(250,249,245,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 -1px 0 var(--rule); }
  footer.foot .wrap { display: flex; gap: 8px; align-items: center; height: 80px; }
  footer .sel { flex: 1; display: flex; align-items: baseline; gap: 12px; }
  footer .sel b { font-size: 28px; font-weight: 500; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  footer .sel span { font: 400 13px var(--mono); color: var(--muted); }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .loading { padding: clamp(80px, 14vw, 200px) 0; }
  .loading code { font: 400 12.5px var(--mono); color: var(--muted); word-break: break-all; }
  dialog { border: 0; border-radius: 24px; background: var(--paper); color: var(--ink); max-width: 560px; width: calc(100% - 40px); padding: 32px; box-shadow: 0 0 0 1px rgba(29,30,27,.1), 0 24px 48px -12px rgba(29,30,27,.28); }
  dialog::backdrop { background: rgba(10,10,10,.28); }
  dialog h2 { font-size: 30px; margin-bottom: 12px; }
  dialog p { margin: 0; color: var(--muted); }
  .warn { display: flex; gap: 10px; align-items: center; margin: 16px 0 0; padding: 12px 16px; border-radius: 14px; background: #fff3d1; color: var(--ink); font-weight: 500; }
  dialog ul { max-height: 220px; overflow: auto; margin: 20px 0 0; padding: 14px 18px; list-style: none; background: var(--bg); border-radius: 14px; font: 400 12.5px/1.7 var(--mono); color: var(--muted); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 26px; }
  .toast { position: fixed; top: 88px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px; padding: 11px 18px 11px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; z-index: 9; box-shadow: 0 0 0 1px rgba(250,249,245,.28), 0 6px 18px rgba(0,0,0,.18); }
  main { padding-bottom: 130px; }

  /* first-run folder picker */
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .pick { display: flex; gap: 16px; align-items: flex-start; padding: 22px 22px 24px; border-radius: 20px; background: var(--bg); cursor: pointer; transition: box-shadow .2s var(--ease), background .2s var(--ease); }
  .pick:hover { box-shadow: inset 0 0 0 1.5px var(--rule); }
  .pick:has(input:checked) { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pick input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: #1d1e1b; flex: none; cursor: pointer; }
  .pick .pk { min-width: 0; }
  .pick .nm { font-size: 19px; }
  .pick .pth, .pick .note { display: block; }
  .pickbox { position: relative; display: flex; }
  .pickbox .pick { flex: 1; padding-right: 56px; }
  .rm { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: background .2s var(--ease), color .2s var(--ease); }
  .rm:hover, .rm:focus-visible { background: rgba(29,30,27,.08); color: var(--ink); }
  .rm svg { width: 16px; height: 16px; }
  .settings .lead-sm { margin: -6px 0 20px; color: var(--muted); max-width: 70ch; }
  .addrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 22px; }
  .addrow .or { font: 400 13px var(--mono); color: var(--muted); padding: 0 4px; }
  .addrow input { flex: 1; min-width: 240px; max-width: 480px; height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--bg); }
  .addrow input::placeholder { color: var(--muted); }
  .hint { font-size: 14px; color: var(--muted); margin: 10px 0 0; max-width: 70ch; }
  .opt { display: flex; gap: 12px; align-items: flex-start; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--rule); cursor: pointer; max-width: 70ch; }
  .opt input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: #1d1e1b; flex: none; }
  .opt span { color: var(--muted); } .opt b { color: var(--ink); font-weight: 500; }
  .err { color: #b3261e; font-weight: 500; margin: 18px 0 0; min-height: 1.5em; }
  .go { display: flex; gap: 8px; margin-top: 8px; }
  .settings h2 { font-size: clamp(26px, 2.4vw, 36px); margin-bottom: 18px; }
  section.block.settings { margin-bottom: clamp(40px, 5vw, 72px); }
  .ver { margin: 0 0 18px; color: var(--muted); } .ver b { color: var(--ink); font-weight: 500; }
  .upd { margin-top: 18px; padding: 22px 24px; border-radius: 20px; background: var(--bg); max-width: 760px; }
  .upd h3 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
  .upd p { margin: 10px 0 0; color: var(--muted); }
  .upd .notes { margin: 14px 0 0; padding: 14px 18px; border-radius: 14px; background: var(--paper); white-space: pre-wrap; font: 400 13.5px/1.6 var(--sans); color: var(--ink); }
  .upd ol { margin: 14px 0 0; padding-left: 22px; } .upd li { margin: 8px 0; } .upd li::marker { color: var(--muted); }
  .cmd { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 10px 14px; border-radius: 12px; background: var(--paper); font: 400 13px var(--mono); }
  .updbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 18px; padding: 10px 10px 10px 18px; border-radius: 999px; background: var(--bg); font-weight: 500; width: fit-content; }
  .intro { padding: clamp(20px, 3vw, 44px) 0 clamp(28px, 3vw, 44px); }
  .intro h1 { max-width: 16ch; }
  /* the Creative Mash shapes: random on each visit, new ones on every click */
  .intro.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(32px, 5vw, 80px); align-items: center; }
  .orns { --cell: clamp(54px, 6.2vw, 92px); display: grid; grid-template-columns: repeat(4, var(--cell)); grid-auto-rows: var(--cell); gap: 10px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px; }
  .orns:focus-visible { outline: 2px solid var(--ink); outline-offset: 10px; }
  .orn { display: block; width: 100%; height: 100%; transition: opacity .2s var(--ease), transform .2s var(--ease); }
  .orn.out { opacity: 0; transform: scale(.55); }
  .orn.blank { background: none; }
  .orn.circle { border-radius: 50%; }
  .orn.q-tl { border-top-left-radius: 100%; } .orn.q-tr { border-top-right-radius: 100%; }
  .orn.q-bl { border-bottom-left-radius: 100%; } .orn.q-br { border-bottom-right-radius: 100%; }
  .orn.t-tl { clip-path: polygon(0 0, 100% 0, 0 100%); } .orn.t-tr { clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .orn.t-bl { clip-path: polygon(0 0, 100% 100%, 0 100%); } .orn.t-br { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .orn.half-up { height: 50%; align-self: end; border-radius: 9999px 9999px 0 0; }
  .orn.half-right { width: 50%; border-radius: 0 9999px 9999px 0; }
  .credit { margin: 0; padding: 28px 0 0; border-top: 1px solid var(--rule); font: 400 13px var(--mono); color: var(--muted); }
  .credit a { color: var(--ink); text-underline-offset: 3px; }
  a.home { display: block; color: inherit; }
  @media (max-width: 900px) {
    .intro.hero { display: block; } .orns { display: none; }
    .updbar { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; border-radius: 18px; padding: 14px 16px; width: auto; } .updbar .dot { margin-top: 7px; } .updbar button { grid-column: 2; justify-self: start; }
    .crumb { display: none; } header.top .wrap { gap: 8px; }
    .cards, .cards.two { grid-template-columns: 1fr; } .bold { min-height: 220px; }
    .facts { grid-template-columns: 1fr 1fr; } .facts div:nth-child(3) { padding-left: 0; border-left: 0; }
    .proj { grid-template-columns: 110px 1fr 64px; gap: 12px; } td.act { display: none; } .chart { padding: 8px 18px; }
    footer .pill.hide-sm { display: none; }
  }
</style>
</head>

</div></footer>

  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <p id="dlgWarn" class="warn" hidden></p>
  <ul id="dlgList"></ul>
  <div class="row"><button class="pill ghost" id="dlgCancel">Cancel</button><button class="pill solid" id="dlgOk">Move to Trash</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script nonce="__NONCE__">
const TOKEN = "__TOKEN__";
const KINDS = [
  ["all", "Everything", null], ["regen", "Rebuildable", "--c-regen"], ["backup", "Backups and copies", "--c-backup"],
  ["unused", "Media not in use", "--c-unused"], ["duplicate", "Duplicates", "--g-orange"], ["cache", "Caches", "--g-sky"],
];
const SEG = [
  ["regen", "Rebuildable", "--c-regen"],
  ["backup", "Backups and copies", "--c-backup"],
  ["media_unused", "Media not in use", "--c-unused"],
  ["media_used", "Media in use", "--c-used"],
  ["worktrees", "Claude session copies", "--c-wt"],
  ["other", "Everything else", "--c-other"],
];
const RISK = { safe: ["Safe to remove", "--g-green"], review: ["Worth a look", "--g-yellow"], keep: ["Probably keep", "--g-blue"] };
const ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
let D = null, view = { kind: "all", project: null, q: "" };
let OS = { computer: "computer", reveal: "Show in folder", bin: "Trash" }, HOME_DIR = "", SEP = "/";
let APP = { version: "", install: "zip", can_pick: false, check_updates: false }, UPD = null, autoChecked = false;
const sel = new Set(), gone = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(b) { if (b < 1024) return b + " B"; const u = ["KB", "MB", "GB", "TB"]; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < 3); return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + " " + u[i]; }
const tilde = p => HOME_DIR && (p === HOME_DIR || p.startsWith(HOME_DIR + SEP)) ? "~" + p.slice(HOME_DIR.length) : p;
const credit = () => `<p class="credit">Cutting Room Floor is a free tool by <a href="https://creativemash.ie" target="_blank" rel="noopener">Creative Mash</a>. Use it at your own risk: check anything before you remove it.</p>`;
const kindOf = it => it.kind === "media" ? (it.status === "unused" ? "unused" : "used") : it.kind;
const dot = v => `<span class="dot" style="background:var(${v})"></span>`;

async function get(url) {
  const r = await fetch(url, { headers: { "X-Token": TOKEN } });
  return r.json();
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN }, body: JSON.stringify(body || {}) });
  return r.json();
}
function scanning() {
  $("#foot").hidden = true; $("#rescan").hidden = true; $("#settings").hidden = true;
  $("#app").innerHTML = `<div class="loading"><h1>Checking the cutting room floor</h1><p id="prog" class="lead"></p></div>`;
}
async function poll() {
  const s = await get("/state");
  OS = s.os; HOME_DIR = s.home; SEP = s.sep;
  APP = { version: s.version, install: s.install, can_pick: s.can_pick, check_updates: s.check_updates };
  $("#trashBtn").textContent = $("#dlgOk").textContent = `Move to ${OS.bin}`;
  if (s.status === "setup") { openSetup(); return; }
  if (s.status === "ready") { D = s.data; render(); autoCheck(); return; }
  if (s.status === "error") { $("#app").innerHTML = `<div class="loading"><h1>The scan stopped</h1><code>${esc(s.error)}</code></div>`; return; }
  if (!$("#prog") || !$(".loading h1").textContent.startsWith("Checking")) scanning();
  $("#prog").innerHTML = `<code>${esc(s.progress || "Starting")}</code>`;
  setTimeout(poll, 600);
}

// ---- first run and Settings: the folders to look at, and updates ----
async function openSetup(settings) {
  const r = await get("/suggest");
  $("#foot").hidden = true; $("#rescan").hidden = true; $("#settings").hidden = true;
  const picks = r.suggestions;
  const card = (s, suggested) => `<div class="pickbox"${suggested ? ' data-sugg="1"' : ""}><label class="pick"><input type="checkbox" value="${esc(s.path)}" ${s.checked ? "checked" : ""}>
      <span class="pk"><span class="nm">${esc(s.name)}${s.claude ? `<span class="tag">${dot("--g-purple")}Used with Claude</span>` : ""}</span>
      <span class="pth">${esc(s.display)}</span><span class="note">${esc(s.note || "")}</span></span></label>
      <button class="rm" type="button" aria-label="Remove ${esc(s.name)} from the list" title="Remove from the list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;
  const hide = new Set();
  const win = OS.name === "windows";
  const copyHint = win ? "To copy a folder’s path, hold Shift, right-click the folder in Explorer and choose Copy as path."
    : OS.name === "mac" ? "To copy a folder’s path, select it in Finder, hold Option, right-click and choose Copy as Pathname."
    : "Paste the full path of any folder.";
  const folders = `
      ${picks.length ? `<div class="picks" id="picks" role="group" aria-label="Folders to look at">${picks.map(s => card(s, true)).join("")}</div>`
        : `<p class="hint">We couldn’t find any project folders on our own. Add the folder where you keep your work.</p><div class="picks" id="picks"></div>`}
      <div class="addrow">
        ${APP.can_pick ? `<button class="pill ring" id="pickBtn">Choose a folder…</button><span class="or">or paste one</span>` : ""}
        <input id="addPath" aria-label="Folder location" placeholder="${win ? "For example C:\\Users\\you\\Work" : "For example ~/Work"}">
        <button class="pill ${APP.can_pick ? "ghost" : "ring"}" id="addBtn">Add</button>
      </div>
      <p class="hint">${copyHint}</p>
      <label class="opt"><input type="checkbox" id="useCaches" ${r.caches ? "checked" : ""}>
        <span><b>Also measure app caches.</b> Download and app caches outside your projects, which apps rebuild when needed.</span></label>
      <p class="err" id="setupErr" role="alert"></p>
      <div class="go"><button class="pill solid" id="startScan">${settings ? "Save and scan again" : "Start the scan"}</button>${settings && D ? `<button class="pill ghost" id="cancelSetup">Back to results</button>` : ""}</div>`;
  $("#app").innerHTML = settings ? `
    <div class="intro"><h1>Settings</h1></div>
    <section class="block settings"><h2>Your folders</h2>
      <p class="lead-sm">Only ticked folders are looked at. Use × to take a folder off this list. Changes are saved when you scan again.</p>${folders}</section>
    <section class="block settings" id="updates">
      <h2>Updates</h2>
      <p class="ver">You have version <b>${esc(APP.version)}</b>.</p>
      <div class="go"><button class="pill ring" id="checkUpd">Check for updates</button></div>
      <div id="updOut">${UPD ? updBox(UPD) : ""}</div>
      <label class="opt"><input type="checkbox" id="autoUpd" ${APP.check_updates ? "checked" : ""}>
        <span><b>Check each time I open Cutting Room Floor.</b> This only asks GitHub for the latest version number. Nothing about your files leaves your ${esc(OS.computer)}.</span></label>
    </section>
    ${credit()}` : `
    <div class="intro hero"><div>
      <h1>Which folders should we look at?</h1>
      <p class="lead">Tick where you keep your projects. Only ticked folders are read, and nothing leaves your ${esc(OS.computer)}.</p>
    </div>${orns()}</div>
    <section class="block">${folders}</section>
    ${credit()}`;

  const addPath = v => {
    v = v.trim().replace(/^["']|["']$/g, "");
    if (/^~(?=$|[\\/])/.test(v) && HOME_DIR) v = HOME_DIR + v.slice(1);
    if (v.length > 1 && !/^[A-Za-z]:[\\/]$/.test(v)) v = v.replace(/[\\/]+$/, "");
    if (!v) return;
    const same = p => SEP === "\\" ? p.toLowerCase() === v.toLowerCase() : p === v;
    const have = [...document.querySelectorAll("#picks input")].find(i => same(i.value));
    if (have) { have.checked = true; have.closest(".pick").scrollIntoView({ block: "nearest" }); return; }
    const name = v.replace(/[\\/]+$/, "").split(/[\\/]/).pop() || v;
    $("#picks").insertAdjacentHTML("beforeend", card({ path: v, display: tilde(v), name, note: "Added by you.", checked: true }));
    $("#setupErr").textContent = "";
  };
  const add = () => { addPath($("#addPath").value); $("#addPath").value = ""; $("#addPath").focus(); };
  $("#addBtn").onclick = add;
  $("#picks").onclick = e => {
    const b = e.target.closest(".rm"); if (!b) return;
    const box = b.closest(".pickbox");
    if (box.dataset.sugg) hide.add(box.querySelector("input").value);
    const next = box.nextElementSibling || box.previousElementSibling;
    box.remove();
    (next ? next.querySelector(".rm") : $("#addPath")).focus();
  };
  $("#addPath").onkeydown = e => { if (e.key === "Enter") add(); };
  if ($("#pickBtn")) $("#pickBtn").onclick = async () => {
    const b = $("#pickBtn"), label = b.textContent;
    b.disabled = true; b.textContent = `Choose a folder in the window that opened`;
    try {
      const res = await post("/pick-folder");
      if (res.path) addPath(res.path);
      else if (res.error) $("#setupErr").textContent = res.error;
    } catch (e) { $("#setupErr").textContent = "The folder window couldn’t open. Paste the folder’s location instead."; }
    b.disabled = false; b.textContent = label;
  };
  if ($("#cancelSetup")) $("#cancelSetup").onclick = () => render();
  $("#startScan").onclick = async () => {
    const roots = [...document.querySelectorAll("#picks input:checked")].map(i => i.value);
    if (!roots.length) { $("#setupErr").textContent = "Tick at least one folder, or add one."; return; }
    $("#startScan").disabled = true;
    const listed = [...document.querySelectorAll("#picks input")].map(i => i.value);
    const res = await post("/setup", { roots, caches: $("#useCaches").checked, hide: [...hide], listed });
    $("#startScan").disabled = false;
    if (res.error) { $("#setupErr").textContent = res.error; return; }
    sel.clear(); gone.clear(); view = { kind: "all", project: null, q: "" };
    scanning(); setTimeout(poll, 400);
  };
  if (!settings) return;
  $("#checkUpd").onclick = async () => {
    const b = $("#checkUpd"); b.disabled = true; b.textContent = "Checking…";
    try { UPD = await post("/check-update"); } catch (e) { UPD = { error: "Couldn’t check just now. Try again." }; }
    b.disabled = false; b.textContent = "Check for updates";
    $("#updOut").innerHTML = updBox(UPD); wireCopy();
  };
  $("#autoUpd").onchange = e => { APP.check_updates = e.target.checked; post("/prefs", { check_updates: e.target.checked }); };
  wireCopy();
  if (settings === "updates") $("#updates").scrollIntoView({ block: "start" });
}
$("#settings").onclick = () => openSetup(true);

// ---- the Creative Mash shapes ----
// A new random set on each visit; click (or press Enter on) the shapes for a new set.
// The set is kept between redraws, so filtering the list doesn't reshuffle them.
const SHAPES = ["circle", "q-tl", "q-tr", "q-bl", "q-br", "t-tl", "t-tr", "t-bl", "t-br", "half-up", "half-right"];
const FILLS = ["--g-blue", "--g-pink", "--g-orange", "--g-green", "--g-yellow", "--g-purple", "--g-sky", "--g-navy"];
const anyOf = a => a[Math.floor(Math.random() * a.length)];
function shapeSet(prev) {
  let set;
  do {
    set = Array.from({ length: 12 }, (_, i) => {
      if (Math.random() < 0.25) return null;
      let c;
      do { c = { s: anyOf(SHAPES), f: anyOf(FILLS) }; } while (prev && prev[i] && prev[i].s === c.s && prev[i].f === c.f);
      return c;
    });
  } while (set.filter(Boolean).length < 7 || set.filter(Boolean).length > 10);
  return set;
}
let ORN = shapeSet();
const ornClass = c => "orn " + (c ? c.s : "blank");
const ornStyle = c => c ? `background:var(${c.f})` : "";
const orns = () => `<button class="orns" type="button" aria-label="Shuffle the shapes" title="Click for new shapes">${ORN.map(c => `<span class="${ornClass(c)}" style="${ornStyle(c)}"></span>`).join("")}</button>`;
function shuffle(box) {
  ORN = shapeSet(ORN);
  [...box.children].forEach((cell, i) => setTimeout(() => {
    cell.classList.add("out");
    setTimeout(() => {
      cell.className = ornClass(ORN[i]) + " out";
      cell.setAttribute("style", ornStyle(ORN[i]));
      void cell.offsetWidth;
      cell.classList.remove("out");
    }, 200);
  }, i * 35));
}
$("#app").addEventListener("click", e => { const box = e.target.closest(".orns"); if (box) shuffle(box); });

// ---- updates: never installed from here, only explained ----
const cmd = c => `<div class="cmd"><code>${esc(c)}</code><button class="pill ghost sm" data-copy="${esc(c)}">Copy</button></div>`;
function updBox(u) {
  if (u.error) return `<div class="upd"><h3>${dot("--g-yellow")}Couldn’t check for updates</h3><p>${esc(u.error)}</p></div>`;
  if (!u.newer) return `<div class="upd"><h3>${dot("--g-green")}You’re up to date</h3><p>Version ${esc(u.current)} is the latest.</p></div>`;
  const steps = {
    claude: `<li>Ask Claude to <b>update Cutting Room Floor</b>. Or run this in ${OS.name === "windows" ? "PowerShell" : "Terminal"}:${cmd("claude plugin update cutting-room-floor@creativemash")}</li>
      <li>Start a new Claude session, then ask Claude to run Cutting Room Floor again.</li>`,
    git: `<li>Close this page, then run this in ${OS.name === "windows" ? "PowerShell" : "Terminal"}:${cmd(`git -C "${u.folder}" pull`)}</li>
      <li>Start Cutting Room Floor again.</li>`,
    zip: `<li><a href="${esc(u.repo)}" target="_blank" rel="noopener">Download the new version from GitHub</a> and put it in place of your old copy. Your folder choices are saved separately, so they stay.</li>
      <li>Start Cutting Room Floor again.</li>`,
  }[u.install] || "";
  return `<div class="upd"><h3>${dot("--g-pink")}Version ${esc(u.latest)} is available</h3>
    <p>You have ${esc(u.current)}. Nothing changes until you update.</p>
    ${u.notes ? `<div class="notes">${esc(u.notes.replace(/^\s*[-*] /gm, "• "))}</div>` : ""}
    <ol>${steps}</ol>
    ${u.install === "claude" ? `<p>To get updates without asking, type <code>/plugin</code> in Claude Code in a terminal, open <b>Marketplaces</b>, pick <b>creativemash</b> and turn on auto-update.</p>` : ""}
  </div>`;
}
function wireCopy() {
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch (e) { b.textContent = "Select and copy"; }
    setTimeout(() => b.textContent = "Copy", 1600);
  });
}
async function autoCheck() {
  if (autoChecked || !APP.check_updates) return;
  autoChecked = true;
  try { UPD = await post("/check-update"); } catch (e) { return; }
  if (UPD.newer && $(".intro .eyebrow")) render();
}

function totals() {
  const live = D.items.filter(i => !gone.has(i.id));
  const sum = f => live.filter(f).reduce((a, i) => a + i.size, 0);
  return {
    projects: Object.values(D.projects).reduce((a, p) => a + Object.values(p).reduce((x, y) => x + y, 0), 0),
    safe: sum(i => i.risk === "safe"), review: sum(i => i.risk === "review"),
    wt: D.worktrees.reduce((a, w) => a + w.size, 0), count: live.filter(i => i.risk !== "keep").length,
  };
}

function render() {
  const t = totals();
  const projs = Object.entries(D.projects).map(([n, c]) => [n, c, Object.values(c).reduce((a, b) => a + b, 0)])
    .filter(p => p[2] > 0).sort((a, b) => b[2] - a[2]);
  const maxP = projs.length ? projs[0][2] : 1;
  const counts = {}; KINDS.forEach(([k]) => counts[k] = 0);
  D.items.forEach(i => { if (!gone.has(i.id) && i.risk !== "keep") { counts.all++; counts[kindOf(i)]++; } });
  const hasCaches = D.items.some(i => i.kind === "cache");

  $("#app").innerHTML = `
    <div class="intro hero"><div>
      ${UPD && UPD.newer ? `<p class="updbar">${dot("--g-pink")}Version ${esc(UPD.latest)} of Cutting Room Floor is available<button class="pill ring sm" id="seeUpd">See how to update</button></p>` : ""}
      <p class="eyebrow">Scanned ${esc(D.scanned_at)}</p>
      <h1>What’s on your cutting room floor?</h1>
      <p class="lead">Leftover renders, test runs, copies and build files in ${D.roots.map(r => `<code>${esc(tilde(r))}</code>`).join(", ")}${D.caches ? " and your app caches" : ""}. Nothing is removed until you choose it, and anything you remove goes to the ${esc(OS.bin)} first.</p>
    </div>${orns()}</div>

    <div class="facts">
      <div><b>${fmt(D.disk.free)}</b><span>free of ${fmt(D.disk.total)} on this disk</span></div>
      <div><b>${fmt(t.projects)}</b><span>in ${projs.length} project folders</span></div>
      <div><b>${t.count}</b><span>things worth checking</span></div>
    </div>

    <div class="cards${D.worktrees.length ? "" : " two"}">
      <div class="bold" style="background:var(--g-green)"><span class="mk" style="border-radius:50%" aria-hidden="true"></span>
        <span class="k">Safe to sweep up</span><b>${fmt(t.safe)}</b><p>Build files, caches and backups that usually come back by themselves. Check anything you don’t recognise.</p></div>
      <div class="bold" style="background:var(--g-pink)"><span class="mk" style="border-bottom-left-radius:100%" aria-hidden="true"></span>
        <span class="k">Worth a look</span><b>${fmt(t.review)}</b><p>Copies, duplicates, archives and media no project uses. Your call.</p></div>
      ${D.worktrees.length ? `<div class="bold light-text" style="background:var(--g-purple)"><span class="mk" style="clip-path:polygon(100% 0,100% 100%,0 100%)" aria-hidden="true"></span>
        <span class="k">Leave these alone</span><b>${fmt(t.wt)}</b><p>${D.worktrees.length} Claude session copies. Clear old ones in the Claude app under Settings › Storage.</p></div>` : ""}
    </div>

    <section class="block">
      <p class="eyebrow">By project</p>
      <div class="head">
        <h2>Where the space goes</h2>
        <div class="legend">${SEG.map(([, l, c]) => `<span>${dot(c)}${l}</span>`).join("")}</div>
      </div>
      <div class="chart">
      ${projs.slice(0, 24).map(([nm, c, tot]) => `
        <button class="proj ${view.project === nm ? "on" : ""}" data-p="${esc(nm)}" aria-pressed="${view.project === nm}" title="Show only this project">
          <span class="pn">${esc(nm.split(" / ")[1])}<small>${esc(nm.split(" / ")[0])}</small></span>
          <span class="bar" style="width:${Math.max(1, tot / maxP * 100)}%">${SEG.map(([k, l, col]) => c[k] ? `<div style="flex:${c[k]};background:var(${col})" title="${esc(l)}: ${fmt(c[k])}"></div>` : "").join("")}</span>
          <span class="num">${fmt(tot)}</span>
        </button>`).join("")}
      </div>
    </section>

    <section class="block">
      <p class="eyebrow">Review and remove</p>
      <div class="head"><h2>Choose what to keep</h2></div>
      <div class="tabs" role="tablist">${KINDS.map(([k, l, c]) => `<button class="tab ${view.kind === k ? "on" : ""}" role="tab" aria-selected="${view.kind === k}" data-k="${k}">${c ? dot(c) : ""}${l}<em>${counts[k]}</em></button>`).join("")}</div>
      <div class="tools">
        <input type="search" id="q" aria-label="Filter by name or path" placeholder="Filter by name or path" value="${esc(view.q)}">
        ${view.project ? `<button class="chip" id="unproj" aria-label="Remove project filter">${esc(view.project.split(" / ")[1])} <span aria-hidden="true">×</span></button>` : ""}
      </div>
      <table id="list"></table>
    </section>
    ${credit()}`;

  document.querySelectorAll(".proj").forEach(el => el.onclick = () => { view.project = view.project === el.dataset.p ? null : el.dataset.p; render(); });
  document.querySelectorAll(".tab").forEach(el => el.onclick = () => { view.kind = el.dataset.k; render(); });
  $("#q").oninput = e => { view.q = e.target.value; renderList(); };
  if ($("#unproj")) $("#unproj").onclick = () => { view.project = null; render(); };
  $("#rescan").hidden = false;
  $("#settings").hidden = false;
  if ($("#seeUpd")) $("#seeUpd").onclick = () => openSetup("updates");
  $("#foot").hidden = false;
  renderList();
}

$("#rescan").onclick = async () => {
  await post("/rescan"); sel.clear(); gone.clear();
  scanning(); setTimeout(poll, 400);
};

function visible() {
  const q = view.q.trim().toLowerCase();
  return D.items.filter(i => i.risk !== "keep" &&
    (view.kind === "all" || kindOf(i) === view.kind) &&
    (!view.project || i.project === view.project) &&
    (!q || i.path.toLowerCase().includes(q)));
}

function row(i, maxS) {
  const g = gone.has(i.id);
  const [label, col] = RISK[i.risk];
  const nb = i.no_bin && !g;
  return `<tr class="${g ? "gone" : ""}">
    <td class="ck"><input type="checkbox" aria-label="Select ${esc(i.name)}" data-id="${i.id}" ${sel.has(i.id) ? "checked" : ""} ${g || nb ? "disabled" : ""}></td>
    <td><div class="nm">${esc(i.name)}${i.count ? `<span class="cnt">${i.count} files</span>` : ""}<span class="tag">${dot(col)}${label}</span>${nb ? `<span class="tag">${dot("--g-orange")}Can’t go to the ${esc(OS.bin)}</span>` : ""}</div>
      <div class="pth">${esc(tilde(i.path))}</div><div class="note">${esc(i.note)}</div>${nb ? `<div class="note"><b>${esc(i.no_bin)}</b></div>` : ""}</td>
    <td class="sz">${fmt(i.size)}<div class="mini" style="width:${Math.max(4, i.size / maxS * 100)}%"></div></td>
    <td class="act">${g ? `<span class="eyebrow">In the ${esc(OS.bin)}</span>` : `<button class="pill ring sm" data-rev="${i.id}">${esc(OS.reveal)} ${ICON_OUT}</button>`}</td></tr>`;
}

function renderList() {
  const items = visible();
  const maxS = Math.max(1, ...items.map(i => i.size));
  let html = "";
  if (view.kind === "duplicate") {
    const groups = {};
    items.forEach(i => (groups[i.group] = groups[i.group] || []).push(i));
    Object.values(groups).sort((a, b) => b[0].size * b.length - a[0].size * a.length).forEach(gr => {
      html += `<tr class="grp"><td colspan="4">${gr[0].copies} identical copies · ${fmt(gr[0].size)} each</td></tr>` + gr.map(i => row(i, maxS)).join("");
    });
  } else {
    html = items.sort((a, b) => b.size - a.size).map(i => row(i, maxS)).join("");
  }
  $("#list").innerHTML = html || `<tr><td class="empty">Nothing here${view.project || view.q ? " with the current filter" : ""}.</td></tr>`;
  $("#list").querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = () => { cb.checked ? sel.add(cb.dataset.id) : sel.delete(cb.dataset.id); updateFoot(); });
  $("#list").querySelectorAll("[data-rev]").forEach(b => b.onclick = () => post("/reveal", { id: b.dataset.rev }));
  updateFoot();
}

// Unique, non-nested selection, so the same bytes are never counted twice.
function selection() {
  const its = [...sel].map(id => D.items.find(i => i.id === id)).filter(Boolean).sort((a, b) => a.path.length - b.path.length);
  const out = [];
  for (const i of its) if (!out.some(o => i.path === o.path || i.path.startsWith(o.path + SEP))) out.push(i);
  return out;
}
function updateFoot() {
  const s = selection();
  $("#selCount").textContent = s.length;
  $("#selSize").textContent = fmt(s.reduce((a, i) => a + i.size, 0));
  $("#trashBtn").disabled = !s.length;
}
function toast(msg) { const t = $("#toast"); t.innerHTML = dot("--g-green") + esc(msg); t.style.display = "inline-flex"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4500); }

$("#selSafe").onclick = () => { visible().filter(i => i.risk === "safe" && !gone.has(i.id) && !i.no_bin).forEach(i => sel.add(i.id)); renderList(); };
$("#clear").onclick = () => { sel.clear(); renderList(); };
$("#trashBtn").onclick = () => {
  const s = selection();
  $("#dlgTitle").textContent = `Move ${s.length} item${s.length > 1 ? "s" : ""} (${fmt(s.reduce((a, i) => a + i.size, 0))}) to the ${OS.bin}`;
  $("#dlgText").textContent = `They go to the ${OS.bin}, so you can put them back until you empty it. The space comes back once the ${OS.bin} is emptied.`;
  // anything marked "Worth a look" is called out and listed first
  const rv = i => i.risk === "review" ? 0 : 1;
  s.sort((a, b) => rv(a) - rv(b));
  const nr = s.filter(i => i.risk === "review").length;
  $("#dlgWarn").hidden = !nr;
  $("#dlgWarn").innerHTML = nr ? dot("--g-yellow") + esc(`${nr === s.length ? (nr === 1 ? "This is" : "These are all") : `${nr} of these ${nr === 1 ? "is" : "are"}`} marked Worth a look. Make sure you’ve checked ${nr === 1 ? "it" : "them"}.`) : "";
  $("#dlgList").innerHTML = s.map(i => `<li>${i.risk === "review" ? dot("--g-yellow") + " " : ""}${esc(tilde(i.path))}</li>`).join("");
  $("#dlg").showModal();
};
$("#dlgCancel").onclick = () => $("#dlg").close();
$("#dlgOk").onclick = async () => {
  const s = selection();
  $("#dlgOk").disabled = true; $("#dlgOk").textContent = "Moving";
  const r = await post("/trash", { ids: s.map(i => i.id) });
  $("#dlg").close(); $("#dlgOk").disabled = false; $("#dlgOk").textContent = `Move to ${OS.bin}`;
  const ok = r.results.filter(x => x.ok), bad = r.results.filter(x => !x.ok);
  ok.forEach(x => {
    gone.add(x.id); sel.delete(x.id);
    const p = D.items.find(i => i.id === x.id).path;   // anything inside a removed folder is gone too
    D.items.forEach(i => { if (i.path.startsWith(p + SEP)) { gone.add(i.id); sel.delete(i.id); } });
  });
  toast(`${ok.length} moved to the ${OS.bin}${bad.length ? ` · ${bad.length} could not be moved: ${bad[0].msg}` : ""}. Empty the ${OS.bin} to get the space back.`);
  render();
};
poll();
</script>
</body>
</html>
